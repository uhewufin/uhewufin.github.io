name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # weekly, to pick up new Frida gadget releases

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The NDK's clang must come first on PATH for the Android (bionic) build.
      - name: Put the Android NDK on PATH
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          echo "Using NDK at $NDK"
          echo "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Build the agent
        run: >
          dotnet publish agent/LemonAgent.csproj -c Release
          -r linux-bionic-arm64
          -p:DisableUnsupportedError=true
          -p:PublishAotUsingRuntimePack=true
          -o out/agent

      # Browsers usually can't download GitHub release files directly, so the site hosts a copy.
      # Frida gadget releases ship .xz compressed; decompress here since neither the browser
      # nor the AOT-compiled agent can do that themselves.
      - name: Fetch and decompress the Frida gadget
        run: |
          TAG=$(curl -s https://api.github.com/repos/frida/frida/releases/latest | grep -o '"tag_name": *"[^"]*"' | cut -d'"' -f4)
          echo "Using Frida release: $TAG"
          test -n "$TAG"
          URL="https://github.com/frida/frida/releases/download/${TAG}/frida-gadget-${TAG#v}-android-arm64.so.xz"
          curl -L -o gadget.so.xz "$URL"
          unxz gadget.so.xz
          mkdir -p site/gadget
          mv gadget.so site/gadget/libfrida-gadget.so
          echo "$TAG" > site/gadget/version.txt

      - name: Assemble the site
        run: |
          mkdir -p site/agent
          cp index.html site/index.html
          cp out/agent/lemon-agent site/agent/lemon-agent
          ls -lR site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
