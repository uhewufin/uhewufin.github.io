name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The NDK's clang must come first on PATH for the Android (bionic) build.
      - name: Put the Android NDK on PATH
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          echo "Using NDK at $NDK"
          echo "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Build the agent
        run: >
          dotnet publish agent/LemonAgent.csproj -c Release
          -r linux-bionic-arm64
          -p:DisableUnsupportedError=true
          -p:PublishAotUsingRuntimePack=true
          -o out/agent

      - name: Assemble the site
        run: |
          mkdir -p site/agent
          cp index.html site/index.html
          cp out/agent/lemon-agent site/agent/lemon-agent
          ls -l site site/agent

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        
